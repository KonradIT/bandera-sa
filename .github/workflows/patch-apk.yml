name: Patch Frontera -> Bandera

# On-demand only. Downloads the stock Frontera APK from an env-var URL (a GitHub release asset),
# patches it into Bandera, stamps the current main SHA as the version, and publishes the result
# as a GitHub release.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Frontera APK URL (overrides the FRONTERA_APK_URL variable)"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write   # create releases

env:
  # The stock Frontera APK lives in a GitHub release; its URL is a repository variable.
  # Set it under Settings -> Secrets and variables -> Actions -> Variables: FRONTERA_APK_URL
  FRONTERA_APK_URL: ${{ vars.FRONTERA_APK_URL }}
  APKTOOL_VERSION: "3.0.3"
  UBER_SIGNER_VERSION: "1.3.0"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve inputs
        id: cfg
        env:
          INPUT_APK_URL: ${{ github.event.inputs.apk_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          url = os.environ.get("INPUT_APK_URL") or os.environ.get("FRONTERA_APK_URL", "")
          if not url:
              raise SystemExit("No APK URL. Set FRONTERA_APK_URL or pass apk_url.")
          if any(ord(ch) <= 32 or ord(ch) == 127 for ch in url):
              raise SystemExit("APK URL must not contain whitespace or control characters.")
          parsed = urlsplit(url)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
              raise SystemExit("APK URL must be HTTPS without embedded credentials.")
          authenticated = parsed.hostname.lower() in {"github.com", "api.github.com"} and parsed.port in (None, 443)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"apk_url={url}\n")
              output.write(f"github_auth={str(authenticated).lower()}\n")
              output.write(f"short_sha={os.environ['GITHUB_SHA'][:7]}\n")
          PY

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download build tools
        run: |
          mkdir -p tools
          curl -fsSL -o tools/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          curl -fsSL -o tools/uber-apk-signer.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v${UBER_SIGNER_VERSION}/uber-apk-signer-${UBER_SIGNER_VERSION}.jar"

      - name: Download Frontera APK
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.cfg.outputs.apk_url }}
          GITHUB_AUTH: ${{ steps.cfg.outputs.github_auth }}
        run: |
          # Exact hosts only. curl strips Authorization on cross-host redirects.
          if [ "$GITHUB_AUTH" = true ]; then
            curl --proto '=https' --proto-redir '=https' -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o frontera.apk "$URL"
          else
            curl --proto '=https' --proto-redir '=https' -fsSL -o frontera.apk "$URL"
          fi
          file frontera.apk; echo "Downloaded $(du -h frontera.apk | cut -f1)"
          head -c 2 frontera.apk | grep -q 'PK' || { echo "::error::Downloaded file is not an APK (check the URL / auth)"; exit 1; }

      - name: Patch
        run: |
          python patcher/patch.py \
            --apk frontera.apk \
            --out "bandera-${{ steps.cfg.outputs.short_sha }}.apk" \
            --version "${{ steps.cfg.outputs.short_sha }}" \
            --version-code "${{ github.run_number }}" \
            --tools-dir tools

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandera-${{ steps.cfg.outputs.short_sha }}
          path: bandera-${{ steps.cfg.outputs.short_sha }}.apk
          if-no-files-found: error

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_URL: ${{ steps.cfg.outputs.apk_url }}
        run: |
          TAG="bandera-${{ steps.cfg.outputs.short_sha }}"
          PRE=""
          [ "${{ github.event.inputs.prerelease }}" = "true" ] && PRE="--prerelease"
          python - <<'PY'
          import os
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"]
          Path("release-notes.txt").write_text(
              "Bandera build from Frontera.\n"
              f"- Source commit: {sha}\n"
              f"- App versionName: {sha[:7]} (versionCode {os.environ['GITHUB_RUN_NUMBER']})\n"
              f"- Patched from: {os.environ['APK_URL']}\n"
              "Debug-signed; sideload only.\n", encoding="utf-8")
          PY
          # Idempotent: drop any existing release/tag for this commit, then recreate.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "bandera-${{ steps.cfg.outputs.short_sha }}.apk" \
            --title "Bandera ${{ steps.cfg.outputs.short_sha }}" \
            --notes-file release-notes.txt $PRE \
            --target "${{ github.sha }}"
